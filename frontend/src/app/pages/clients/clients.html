<mat-card appearance="outlined">
  <div class="header">
    <h2>Clients</h2>
    <button mat-flat-button color="primary" (click)="addClient()" matTooltip="Ajouter un client">
      <mat-icon>add</mat-icon>
      Ajouter
    </button>
  </div>

  <div class="table-wrap">
    <table mat-table [dataSource]="clients()" class="mat-elevation-z1">

      <!-- Nom -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nom </th>
        <td mat-cell *matCellDef="let c"> {{ c.name }} </td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let c"> {{ c.email }} </td>
      </ng-container>

      <!-- Téléphone -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef> Téléphone </th>
        <td mat-cell *matCellDef="let c"> {{ c.phone || '—' }} </td>
      </ng-container>

      <!-- Créé le -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef> Créé le </th>
        <td mat-cell *matCellDef="let c"> {{ c.createdAt | date:'dd/MM/yyyy' }} </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="col-actions"> Actions </th>
        <td mat-cell *matCellDef="let c" class="col-actions">
          <button mat-icon-button (click)="editClient(c)" matTooltip="Modifier">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteClient(c)" matTooltip="Supprimer">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row        *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Si vide -->
      <tr class="empty" *ngIf="clients().length === 0">
        <td [attr.colspan]="displayedColumns.length">Aucun client pour le moment.</td>
      </tr>
    </table>
  </div>
</mat-card>
